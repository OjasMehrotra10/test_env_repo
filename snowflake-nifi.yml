name: Deploy NiFi Flow via Snowflake

on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install Snowflake CLI
        run: pip install snowflake-cli

      - name: Setup Snowflake Config
        run: |
          mkdir -p ~/.snowflake

          cat <<EOF > ~/.snowflake/config.toml
          [connections.default]
          account = "RBFUEDQ-WBC50273"
          user = "LIRIKSNOWFLAKEADMIN"
          role = "MSK_STREAMING_RL"
          warehouse = "AUDITORIA_WAREHOUSE"
          database = "AUDITORIA"
          schema = "KAFKA_DATA"
          authenticator = "SNOWFLAKE_JWT"
          private_key_path = "~/.snowflake/rsa_key.p8"
          EOF

      # 🔐 Decode Base64 Private Key (SAFE METHOD)
      - name: Inject Private Key
        run: |
          mkdir -p ~/.snowflake
          echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY_BASE64 }}" | base64 --decode > ~/.snowflake/rsa_key.p8
          chmod 600 ~/.snowflake/rsa_key.p8

      # 🧪 Debug (optional - remove later)
      - name: Debug Key (Optional)
        run: |
          ls -l ~/.snowflake
          head -n 2 ~/.snowflake/rsa_key.p8

      - name: Test Snowflake Connection
        run: snow connection test

      - name: Trigger Snowflake Procedure
        run: |
          snow sql -q "CALL RUN_NIPYAPI_PIPELINE();"
