name: Auto Share + NiFi Trigger

on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # -----------------------------
      # Setup Python (for nipyapi)
      # -----------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install snowflake-cli-labs
          pip install nipyapi

      # -----------------------------
      # Setup Snowflake CLI Auth
      # -----------------------------
      - name: Configure Snowflake connection
        run: |
          mkdir -p ~/.snowflake
          echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > ~/.snowflake/rsa_key.p8
          chmod 600 ~/.snowflake/rsa_key.p8

      # -----------------------------
      # Run Stored Procedure
      # -----------------------------
      - name: Execute Snowflake Procedure
        env:
          SNOWFLAKE_ACCOUNT: RBFUEDQ-WBC50273
          SNOWFLAKE_USER: LIRIKSNOWFLAKEADMIN
          SNOWFLAKE_ROLE: MSK_STREAMING_RL
          SNOWFLAKE_PRIVATE_KEY_PATH: ~/.snowflake/rsa_key.p8
        run: |
          snow sql \
            --account $SNOWFLAKE_ACCOUNT \
            --user $SNOWFLAKE_USER \
            --role $SNOWFLAKE_ROLE \
            --private-key-path $SNOWFLAKE_PRIVATE_KEY_PATH \
            -q "CALL AAI_BRONZE.AUTO_SHARE_BRONZE();"

      # -----------------------------
      # Run NiFi Script
      # -----------------------------
      - name: Trigger NiFi via nipyapi
        env:
          NIFI_URL: ${{ secrets.NIFI_URL }}
        run: |
          python scripts/nifi_trigger.py
